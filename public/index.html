<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Painel executivo de performance das squads no Wrike." />
    <title>Performance de squads | QuartaVia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Carme&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/pagination.css" />
  </head>
  <body>
    <main class="portal-main">
      <header class="topbar">
        <div><p class="eyebrow">EXECUÇÃO ESTRATÉGICA</p><h1>Performance de squads</h1><p id="subtitulo" class="note-muted">Conectando execução, fluxo e qualidade do backlog.</p></div>
        <div class="topbar-actions"><span id="atualizado-em" class="updated-at" aria-live="polite"></span><button id="exportar-xlsx" class="btn btn-ghost" type="button">Exportar tarefas XLSX</button><button id="atualizar" class="btn btn-primary" type="button">Atualizar dados</button></div>
      </header>
      <section class="page-filters" aria-label="Filtros do dashboard"><div class="filter-bar">
        <label>Início<input id="inicio" type="date" /></label><label>Fim<input id="fim" type="date" /></label>
        <label>Squad ou área<select id="squad"><option value="">Todas</option></select></label><label>Pessoa<select id="pessoa"><option value="">Todas</option></select></label>
        <div class="filter-actions"><button id="limpar" class="btn btn-ghost" type="button">Limpar filtros</button></div>
      </div></section>
      <section id="dashboard" aria-live="polite"><div class="gd-status">Carregando indicadores…</div></section>
    </main><script type="module" src="/app.js"></script>
  </body>
</html>
